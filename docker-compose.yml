version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: careermatch-postgres
    restart: always
    environment:
      POSTGRES_USER: careermatch
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: careermatch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careermatch-backend
    restart: always
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://careermatch:password123@db:5432/careermatch?schema=public"
      NODE_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      - db

volumes:
  postgres_data:
